<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目录设置 - Koikatsu Mod Manager</title>
<link rel="icon" href="/assets/app.ico">
<style>
/* Only what the shared sheet does not already own: this page is a form, and
   its rows are the one layout the manager never renders. Colours, radii,
   borders and hover behaviour all come from /theme.css, so the first-run
   screen and the manager cannot drift apart again. */
a{color:var(--cyan)}
section{padding:0 0 24px;margin-bottom:24px;border-bottom:1px solid var(--line)}
h2{font-size:16px;margin:0 0 20px}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) 78px;align-items:center;gap:12px;margin:14px 0}
.row.single{grid-template-columns:120px minmax(0,1fr)}
.row>label{display:flex;align-items:center;gap:8px}
.row input[type=text]{width:100%;min-width:0}
.row input[readonly]{background:#eef3f5;color:#4b555d}
input[type=checkbox]{width:17px;height:17px;margin:0}
.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.primary{background:#17899b;color:#fff;border-color:#17899b}
#status{overflow-wrap:anywhere;margin-top:18px;line-height:1.6}
#status.error{color:#a5342d}
.note{margin:-4px 0 0;color:#5b6670;font-size:13px;line-height:1.7}
.note code{background:#eef3f5;border-radius:4px;padding:1px 4px;font-size:12px}
[hidden]{display:none!important}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr) 72px;gap:8px}.row>label{grid-column:1/-1}.row input[type=text]{grid-column:1}}
</style>
<link rel="stylesheet" href="/theme.css">
<body class="settings-page">
<header><div class="brandbar"><img class="brand-mark" src="/assets/app-mark.png" alt=""><div class="brand-title"><div class="archive-number">MODS / CARDS / SCENES</div><h1>Koikatsu <span>Mod Manager</span></h1></div></div><a id="back" href="/gallery.html" hidden>返回管理器</a></header>
<main>
<form id="settings">
<section><h2><span class="section-index">01</span>游戏目录</h2>
<div class="row"><label for="game">游戏目录</label><input id="game" type="text" required autocomplete="off"><button type="button" data-browse="game">浏览…</button></div>
<button id="defaults" type="button">填入默认目录</button>
</section>
<section><h2><span class="section-index">02</span>资源目录</h2>
<div class="row"><label for="mods">Mod</label><input id="mods" type="text" required autocomplete="off"><button type="button" data-browse="mods">浏览…</button></div>
<div class="row"><label for="chara"><input type="checkbox" id="enable-chara" checked aria-label="启用角色卡目录">角色卡</label><input id="chara" type="text" autocomplete="off"><button type="button" data-browse="chara">浏览…</button></div>
<div class="row"><label for="coordinate"><input type="checkbox" id="enable-coordinate" checked aria-label="启用服装卡目录">服装卡</label><input id="coordinate" type="text" autocomplete="off"><button type="button" data-browse="coordinate">浏览…</button></div>
<div class="row"><label for="studio"><input type="checkbox" id="enable-studio" checked aria-label="启用场景目录">场景</label><input id="studio" type="text" autocomplete="off"><button type="button" data-browse="studio">浏览…</button></div>
</section>
<section><h2><span class="section-index">03</span>删除记录</h2>
<div class="row single"><label for="modtrash">记录位置</label><input id="modtrash" type="text" readonly autocomplete="off"></div>
<p class="note">停用 Mod 不会移动文件，只把名字改成 <code>.disabled</code>。这里的 <code>delete-log.jsonl</code> 是「已删除」页恢复操作的全部依据，请勿删除或改动。</p>
</section>
<div class="actions"><button id="save" class="primary" type="submit" disabled>保存并建立索引</button></div>
<div id="status" role="status" aria-live="polite">正在读取配置…</div>
</form>
</main>
<script src="/settings-ui.js"></script>
<script src="/browser-ui.js"></script>
</html>
