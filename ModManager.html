<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koikatsu Mod Manager</title>
<link rel="icon" href="/assets/app.ico">
<link rel="stylesheet" href="manager.css">
<link rel="stylesheet" href="theme.css">
<header>
  <div class="brandbar">
    <img class="brand-mark" src="assets/app-mark.png" alt="">
    <div class="brand-title">
      <div class="archive-number">MODS / CARDS / SCENES</div>
      <h1>Koikatsu <span>Mod Manager</span></h1>
    </div>
    <div class="brand-stamp">LOCAL LIBRARY<span>本地资源库</span></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="视图"></nav>
  <div id="controls"></div>
  <!-- The result line belongs to the search area, not to the gap between the
       header and the sticky bar: it answers "what did the filters leave". -->
  <div id="status" class="status" aria-live="polite"></div>
</header>
<div id="dock" class="dock"></div>
<div class="pager" id="pagerTop">
  <button id="prev" title="上一页" aria-label="上一页">&#8592;</button>
  <span id="page"></span>
  <button id="next" title="下一页" aria-label="下一页">&#8594;</button>
</div>
<div id="viewRoot"></div>
<div class="pager pager-bottom" id="pagerBottom">
  <button id="prevBottom" title="上一页" aria-label="上一页">&#8592;</button>
  <span id="pageBottom"></span>
  <button id="nextBottom" title="下一页" aria-label="下一页">&#8594;</button>
</div>
<footer>预览是包内原图。点击卡片或按住左键拖框可多选，然后批量停用或归档。</footer>
<script src="data.js"></script>
<script src="deps.js"></script>
<script src="mod-search.js"></script>
<script src="app-core.js"></script>
<script src="media-thumbs.js"></script>
<script src="view-mods.js"></script>
<script src="view-trash.js"></script>
<script src="view-archive.js"></script>
<script src="plugin-deps.js"></script>
<script src="preview-ui.js"></script>
<script>
(async () => {
  // deps.js is the index-time snapshot; over http ask once so a deletion from
  // an earlier session cannot leave a stale verdict on screen. Failing here must
  // never keep the page closed: the snapshot is already loaded.
  try { await KK.deps.reload(); } catch (error) { console.warn(error); }
  const initial = location.hash.slice(1);
  KK.openView(['mods', 'deps', 'trash', 'archive'].includes(initial) ? initial : 'mods');
})();
</script>
<script src="/browser-ui.js"></script>
</html>
